<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hozworld-play/">

  <meta charset="UTF-8">
  <!-- Without this the splash lays out at desktop width and shows at ~40% size on phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hoz_world">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>hoz_world</title>
  <link rel="manifest" href="manifest.json">
  <!-- Phase 1 splash: shown until Flutter draws its first frame. Same look as
       lib/ui/screens/boot_loader.dart so the hand-off does not jump. -->
  <style>
    @font-face { font-family: 'PixelifySans'; src: url('assets/assets/fonts/pixelify_sans.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'IBMPlexMono'; src: url('assets/assets/fonts/ibm_plex_mono_regular.ttf') format('truetype'); font-display: block; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999; box-sizing: border-box;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 0 32px; background: #121821;
    }
    /* Same painting and dark overlay as lib/ui/screens/boot_loader.dart LoadingBackdrop */
    #boot-splash {
      background: linear-gradient(rgba(0,0,0,.45),rgba(0,0,0,.6),rgba(0,0,0,.45)), #121821 url('loading_bg.jpg') 40% 50% / cover no-repeat;
    }
    /* Same metrics as lib/ui/screens/boot_loader.dart: title 36, gap 16, board 240, gap 16, slot 48, gap 12, tip 36 = 404 */
    #boot-splash .col { width: 100%; max-width: 360px; display: flex; flex-direction: column; }
    #boot-splash .t {
      height: 36px; display: flex; align-items: center; justify-content: center;
      font-family: 'PixelifySans', sans-serif; font-size: 28px; font-weight: 700;
      letter-spacing: 1px; line-height: 1; color: #fff; white-space: nowrap;
    }
    /* The board is not drawn here: this empty 240 px band keeps the Flutter layout in place. */
    #boot-splash .board { margin-top: 16px; height: 240px; }
    /* Sits where the Flutter Start button sits: same 200x48 slot, centred. No box, just text. */
    #boot-splash .load {
      width: 200px; height: 48px; margin: 16px auto 0; display: flex; align-items: center; justify-content: center;
      font-family: 'IBMPlexMono', monospace; font-size: 14px; line-height: 1; color: rgba(200,206,216,.6);
    }
    /* The Flutter tip box (36 px, after a 12 px gap) */
    #boot-splash .tip { margin-top: 12px; height: 36px; }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div class="col">
      <div class="t">HozWorld</div>
      <div class="board"></div>
      <div class="load">Loading…</div>
      <div class="tip"></div>
    </div>
  </div>
  <script>
    // Flutter fires this once its first frame is painted; the BootLoader takes over.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- flutter_soloud (sound effects) needs its WASM module loaded before Flutter starts -->
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
  <script>
    // Chrome keeps Web Audio suspended unless it starts inside a user gesture, and
    // soloud creates its audio context a moment after the first tap: resume it on taps/keys.
    ['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(function (ev) {
      document.addEventListener(ev, function () {
        try {
          ((window.miniaudio && window.miniaudio.devices) || []).forEach(function (d) {
            if (d && d.webaudio && d.webaudio.state === 'suspended') d.webaudio.resume();
          });
        } catch (e) {}
      }, true);
    });
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
