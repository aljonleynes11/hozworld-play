<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="/hozworld-play/">

  <meta charset="UTF-8">
  <!-- Without this the splash lays out at desktop width and shows at ~40% size on phones. -->
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!-- Safari tints its status bar and toolbar from this (else from the page
       background, which would turn them cream from the splash). -->
  <meta name="theme-color" content="#121821">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="description" content="A new Flutter project.">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="hoz_world">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>HozWorld</title>
  <link rel="manifest" href="manifest.json">
  <!-- Phase 1 splash: shown until Flutter draws its first frame. Same look as
       lib/ui/screens/boot_loader.dart so the hand-off does not jump. -->
  <style>
    /* The page itself stays dark under the game; only the boot splash is cream. */
    html, body { background: #121821; }
    @font-face { font-family: 'PixelifySans'; src: url('assets/assets/fonts/pixelify_sans.ttf') format('truetype'); font-display: block; }
    @font-face { font-family: 'IBMPlexMono'; src: url('assets/assets/fonts/ibm_plex_mono_regular.ttf') format('truetype'); font-display: block; }
    #boot-splash {
      position: fixed; inset: 0; z-index: 9999; box-sizing: border-box;
      /* The desk around the page: the same idea as LoadingPage in
         lib/ui/screens/boot_loader.dart (a page of the painting on a darker
         cream desk). On a phone the page covers it, so it is never seen. */
      display: flex; align-items: center; justify-content: center;
      background: #E9D5AE;
    }
    /* The painting as a page, the same fixed shape as the JPEG (852x1846) and
       the same metrics as LoadingPage: full height, paper cream under it, top
       aligned, no dark overlay. The hand-off to Flutter does not jump. */
    #boot-page {
      box-sizing: border-box; position: relative;
      width: 100%; height: 100%;
      display: flex; flex-direction: column; align-items: center; justify-content: flex-end;
      padding: 0 32px 20px;
      background: #F3E3C0 url('loading_bg.jpg') top center / cover no-repeat;
    }
    /* Wider than the painting's own shape (852/1846 = 0.46, the Flutter
       threshold is a width/height of 0.6): the page keeps its shape and stands
       centred on the desk, with the soft shadow LoadingPage draws. A phone or a
       portrait tablet keeps the full-screen page, exactly as before. */
    @media (min-aspect-ratio: 6/10) {
      #boot-page {
        width: auto; height: 100%; aspect-ratio: 852 / 1846;
        box-shadow: 0 0 24px 2px rgba(0, 0, 0, .35);
      }
    }
    /* Same metrics as lib/ui/screens/boot_loader.dart: the brand block sits at
       the top of the page, 24 px under the safe area; the bottom group is
       board 200, gap 12, slot 76, gap 10, tip 36 = 334 */
    #boot-splash .col { width: 100%; max-width: 360px; display: flex; flex-direction: column; }
    /* The brand block: the logo, then the title 2 px under it, centred. Absolute
       so the group below keeps its own bottom metrics, and no pointer events so
       a tap goes through to the board and the Start button. */
    #boot-splash .brand {
      position: absolute; left: 0; right: 0;
      top: calc(env(safe-area-inset-top, 0px) + 24px);
      display: flex; flex-direction: column; align-items: center;
      pointer-events: none;
    }
    /* The plain logo: 16.5% of the page height, capped at 128 px — the same box
       LogoMark takes on the loading page, and frame 0 of its sheet. */
    #boot-splash .logo { display: block; width: min(128px, 16.5vh); height: min(128px, 16.5vh); }
    /* The title: 34 px in a 40 px box, with the paper halo the Flutter one has. */
    #boot-splash .t {
      margin-top: 2px;
      height: 40px; display: flex; align-items: center; justify-content: center;
      font-family: 'PixelifySans', sans-serif; font-size: 34px; font-weight: 700;
      letter-spacing: 1px; line-height: 1; color: #4A3420; white-space: nowrap;
      text-shadow: 0 0 8px rgba(243, 227, 192, .7);
    }
    /* The board is not drawn here: this empty 200 px band keeps the Flutter layout in place. */
    #boot-splash .board { height: 200px; }
    /* Sits where the Flutter Start button sits: 200x48 centred in the 76 px slot. No box, just text. */
    #boot-splash .slot { margin-top: 12px; height: 76px; display: flex; align-items: center; justify-content: center; }
    #boot-splash .load {
      width: 200px; height: 48px; display: flex; align-items: center; justify-content: center;
      font-family: 'IBMPlexMono', monospace; font-size: 14px; line-height: 1; color: #7A5C3A;
    }
    /* The Flutter tip box (36 px, after a 10 px gap) */
    #boot-splash .tip { margin-top: 10px; height: 36px; }
  </style>
</head>
<body>
  <div id="boot-splash">
    <div id="boot-page">
      <div class="brand">
        <img class="logo" src="logo.png" alt="">
        <div class="t">HozWorld</div>
      </div>
      <div class="col">
        <div class="board"></div>
        <div class="slot"><div class="load">Loading…</div></div>
        <div class="tip"></div>
      </div>
    </div>
  </div>
  <script>
    // Flutter fires this once its first frame is painted; the BootLoader takes over.
    window.addEventListener('flutter-first-frame', function () {
      var el = document.getElementById('boot-splash');
      if (el) el.remove();
    });
  </script>
  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <!-- flutter_soloud (sound effects) needs its WASM module loaded before Flutter starts -->
  <script src="assets/packages/flutter_soloud/web/libflutter_soloud_plugin.js" defer></script>
  <script src="assets/packages/flutter_soloud/web/init_module.dart.js" defer></script>
  <script>
    // Chrome keeps Web Audio suspended unless it starts inside a user gesture, and
    // soloud creates its audio context a moment after the first tap: resume it on taps/keys.
    ['pointerdown', 'pointerup', 'keydown', 'touchend'].forEach(function (ev) {
      document.addEventListener(ev, function () {
        try {
          ((window.miniaudio && window.miniaudio.devices) || []).forEach(function (d) {
            if (d && d.webaudio && d.webaudio.state === 'suspended') d.webaudio.resume();
          });
        } catch (e) {}
      }, true);
    });
  </script>
  <script src="flutter_bootstrap.js?v=e710a36-1104-175316" async></script>
</body>
</html>
